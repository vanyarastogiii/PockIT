<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1F3A">
  <title>PockIt · Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='12' fill='%230B1F3A'/><circle cx='24' cy='15' r='7.5' fill='%23E3B04B'/><path d='M10.5 20.5h27v11L24 39.5l-13.5-8z' fill='%23FFFFFF'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
  <aside class="auth-art" aria-hidden="true">
    <a class="brand brand--light" href="index.html"><svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><rect class="bm-tile" width="48" height="48" rx="12"/><circle cx="24" cy="15" r="7.5" fill="#E3B04B"/><circle cx="24" cy="15" r="4.2" fill="none" stroke="#0B1F3A" stroke-width="1.4" opacity=".5"/><path d="M10.5 20.5h27v11L24 39.5l-13.5-8z" fill="#FFFFFF" stroke-linejoin="round"/><path d="M14 24.5h20" stroke="#0B1F3A" stroke-width="1.5" stroke-dasharray="2.2 1.8" opacity=".55"/></svg>PockIt</a>

    <svg class="rosette rosette--auth" viewBox="-100 -100 200 200">
      <defs><ellipse id="petal-a" cx="0" cy="0" rx="92" ry="34" /></defs>
      <g fill="none" stroke="currentColor" stroke-width="0.5">
        <use href="#petal-a" transform="rotate(0)"/><use href="#petal-a" transform="rotate(10)"/>
        <use href="#petal-a" transform="rotate(20)"/><use href="#petal-a" transform="rotate(30)"/>
        <use href="#petal-a" transform="rotate(40)"/><use href="#petal-a" transform="rotate(50)"/>
        <use href="#petal-a" transform="rotate(60)"/><use href="#petal-a" transform="rotate(70)"/>
        <use href="#petal-a" transform="rotate(80)"/><use href="#petal-a" transform="rotate(90)"/>
        <use href="#petal-a" transform="rotate(100)"/><use href="#petal-a" transform="rotate(110)"/>
        <use href="#petal-a" transform="rotate(120)"/><use href="#petal-a" transform="rotate(130)"/>
        <use href="#petal-a" transform="rotate(140)"/><use href="#petal-a" transform="rotate(150)"/>
        <use href="#petal-a" transform="rotate(160)"/><use href="#petal-a" transform="rotate(170)"/>
        <circle r="40"/><circle r="44"/><circle r="96"/>
      </g>
    </svg>

    <div class="auth-pitch">
      <p class="auth-headline">Pay anyone with just their email.</p>
      <p class="auth-sub">Add money, send it in seconds, and keep a record of every rupee that moves.</p>
    </div>
  </aside>

  <main class="auth-main">
    <div class="auth-box">
      <a class="brand auth-brand-mobile" href="index.html"><svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><rect class="bm-tile" width="48" height="48" rx="12"/><circle cx="24" cy="15" r="7.5" fill="#E3B04B"/><circle cx="24" cy="15" r="4.2" fill="none" stroke="#0B1F3A" stroke-width="1.4" opacity=".5"/><path d="M10.5 20.5h27v11L24 39.5l-13.5-8z" fill="#FFFFFF" stroke-linejoin="round"/><path d="M14 24.5h20" stroke="#0B1F3A" stroke-width="1.5" stroke-dasharray="2.2 1.8" opacity=".55"/></svg>PockIt</a>

      <h1 id="auth-title">Log in to your wallet</h1>

      <div class="segmented" role="tablist" aria-label="Choose">
        <button class="segment is-active" data-tab="login" role="tab" aria-selected="true">Log in</button>
        <button class="segment" data-tab="signup" role="tab" aria-selected="false">Sign up</button>
      </div>

      <form id="login-form" class="form" novalidate>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn--primary btn--block">Log in</button>
      </form>

      <form id="signup-form" class="form" hidden novalidate>
        <label class="field">
          <span>Full name</span>
          <input type="text" name="name" required maxlength="150" autocomplete="name" placeholder="Priya Sharma">
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" required minlength="8" autocomplete="new-password">
          <small class="hint">At least 8 characters. Avoid common passwords.</small>
        </label>
        <button type="submit" class="btn btn--primary btn--block">Create wallet</button>
      </form>

      <p id="auth-message" class="form-error" role="alert"></p>

      <div class="demo-box">
        <p>Just looking around? Log in to a demo wallet with sample history and requests.</p>
        <button type="button" id="demo-login" class="btn btn--quiet btn--block">Try the demo account</button>
        <button type="button" id="demo-shop-login" class="btn btn--ghost btn--block">Log in as the Chai &amp; Co. shop owner</button>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
