# Runs the full test suite against a real PostgreSQL on every push and pull request.
# PostgreSQL matters: the concurrency tests (row locks) are skipped on SQLite.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wallet
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-1234567890

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Check the API schema
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml

      - name: Run tests (including concurrency tests on PostgreSQL)
        run: python manage.py test -v 2

      - name: Seed demo data and reconcile the ledger
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py reconcile
