# Serves the HTML/CSS/JS and forwards API + admin calls to Django.
# Because both live on the same origin (localhost:8080), no CORS is needed.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # The demo shop's pages are static, but its API and webhook receiver are Django.
    location ~ ^/(api|admin|static|shop/api|shop/webhooks)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
