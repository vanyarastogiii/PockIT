# docker compose up --build
#   App:   http://localhost:8080
#   Admin: http://localhost:8080/admin
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432" # so you can also run Django locally against this DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      SITE_URL: http://web   # where the demo shop's webhook receiver is reachable from inside Docker
    depends_on:
      db:
        condition: service_healthy

  # Retries webhooks that failed (merchant server down, timeouts) with backoff.
  worker:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: python manage.py deliver_webhooks --loop
    depends_on:
      - backend

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
